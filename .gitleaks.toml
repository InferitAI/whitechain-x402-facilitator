# gitleaks configuration for the "Secrets (gitleaks)" job in .github/workflows/ci.yml.
#
# The job scans the full git history with gitleaks' default rules. The allowlists below cover public values that the
# generic-api-key rule flags; each one was checked by hand (2026-11-01, full history: 0 real findings). Keep them
# narrow: allow a value by its exact shape, never a whole folder. A new finding means either a real secret (rotate it
# first) or a new public value (add its exact shape here, with a reason).

title = "whitechain-x402-facilitator"

[extend]
useDefault = true

[[allowlists]]
description = "Anvil's published development keys (accounts 0-9 of the default mnemonic); they hold nothing on any real network"
regexes = [
  '''^(0x)?(ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80|59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d|5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a|7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6|47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a|8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba|92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e|4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356|dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97|2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6)$''',
]

[[allowlists]]
description = "Public EVM addresses"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
]

[[allowlists]]
description = "API key entries that hold only the SHA-256 of a key (the documented API_KEYS format), never the key"
regexTarget = "match"
regexes = [
  '''"?keySha256"?\s*:\s*"[0-9a-f]{64}"''',
]

[[allowlists]]
description = "Test fixtures for API key parsing, not credentials"
regexes = [
  '''^(plain|same)-key-0123456789abcdef$''',
]
