<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Whitechain x402 Facilitator: HTTP 402 payments for AI agents and APIs on Whitechain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1013"/>
      <stop offset="1" stop-color="#121a1c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe0b4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5fe0b4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5fe0b4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="626" width="1200" height="4" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(72 72)">
    <rect width="72" height="72" rx="16" fill="#151a1f" stroke="#262d35"/>
    <path d="M20 20 L52 52 M52 20 L20 52" stroke="#5fe0b4" stroke-width="10" stroke-linecap="round"/>
    <circle cx="56" cy="56" r="8" fill="#fbfaf7"/>
    <path d="M52 56.2 L55.1 59.2 L60.6 53.3" stroke="#0d1013" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="164" y="104" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" letter-spacing="2" fill="#5fe0b4">OPEN SOURCE · APACHE-2.0 · eip155:1874</text>
  <text x="164" y="140" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8b94a0">github.com/InferitAI/whitechain-x402-facilitator</text>

  <!-- title -->
  <text x="72" y="268" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2" fill="#eceef1">Whitechain x402</text>
  <text x="72" y="356" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2" fill="#eceef1">Facilitator</text>
  <text x="72" y="418" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#b9c0c9">HTTP 402 payments for AI agents and APIs on WhiteBIT's L2.</text>
  <text x="72" y="460" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#b9c0c9">Payer pays merchant directly. No custody. Facilitator pays the gas.</text>

  <!-- flow strip -->
  <g transform="translate(72 520)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <rect width="270" height="60" rx="12" fill="#151a1f" stroke="#262d35"/>
    <text x="20" y="37" fill="#f0b561">402 Payment Required</text>
    <path d="M282 30 H314" stroke="#5fe0b4" stroke-width="3"/>
    <path d="M308 22 L318 30 L308 38" fill="none" stroke="#5fe0b4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="330" width="420" height="60" rx="12" fill="#151a1f" stroke="#262d35"/>
    <text x="350" y="37" fill="#eceef1">sign EIP-3009 · /verify · /settle</text>
    <path d="M762 30 H794" stroke="#5fe0b4" stroke-width="3"/>
    <path d="M788 22 L798 30 L788 38" fill="none" stroke="#5fe0b4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="810" width="190" height="60" rx="12" fill="#10271f" stroke="#1f4d3d"/>
    <text x="830" y="37" fill="#5fe0b4">200 OK · paid</text>
  </g>
</svg>
